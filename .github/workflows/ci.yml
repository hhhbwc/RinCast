name: CI

# Every commit on every branch, and every pull request. Tags don't count as commits here.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer commit on the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Streamer, SteamVR driver, tools, core tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S pc -B build\pc -G "Visual Studio 17 2022" -A x64 -DRINCAST_CORE_TESTS=ON
      - name: Build
        run: cmake --build build\pc --config Release --parallel
      - name: Core tests
        run: build\pc\bin\Release\rincast-core-tests.exe

  smoke:
    name: Streamer smoke (stream + UI tick survival)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S pc -B build\smoke -G "Visual Studio 17 2022" -A x64 -DRINCAST_CORE_TESTS=ON
      - run: cmake --build build\smoke --config Release --target rincast-streamer headset-sim --parallel
      # ROUND20 L16 regression: the streamer must survive a client session with the UI
      # status tick running (a mutex re-lock in StatusJson killed it here before).
      - name: 10 s stream + UI tick smoke
        shell: python
        run: |
          import subprocess, time, os, sys
          bin_dir = os.path.join(os.getcwd(), "build/smoke/bin/Release")
          log = os.path.join(bin_dir, "smoke-streamer.log")
          p = subprocess.Popen([os.path.join(bin_dir, "RinCast Streamer.exe")],
                               stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, cwd=bin_dir)
          time.sleep(3)
          sim = subprocess.run([os.path.join(bin_dir, "headset-sim.exe"), "--pc", "127.0.0.1",
                                "--vr", "--desktop", "--seconds", "10", "--codec", "hevc"],
                               capture_output=True, cwd=bin_dir)
          time.sleep(3)
          alive = p.poll() is None
          p.terminate()
          try:
              p.wait(timeout=10)
          except Exception:
              p.kill()
          print("sim exit:", sim.returncode, "| streamer survived:", alive)
          sys.exit(0 if alive else 1)

  audio-driver:
    name: Audio driver
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: wdk-${{ hashFiles('scripts/fetch-deps.ps1') }}
      - name: Fetch the WDK
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-deps.ps1
      - name: Build
        run: |
          $wdk = (Get-ChildItem deps\packages -Directory -Filter 'Microsoft.Windows.WDK.x64.*' | Select-Object -Last 1).FullName
          cmake -S pc\audio-driver -B build\audio -G "Visual Studio 17 2022" -A x64 "-DWDK_ROOT=$wdk\c"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build\audio --config Release

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test ./...

  android:
    name: Headset app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the NDK and CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Build
        working-directory: headset
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
